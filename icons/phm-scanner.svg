<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PHM-Scanner">
  <defs>
    <linearGradient id="shield" x1="18" y1="18" x2="238" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111318"/>
      <stop offset="1" stop-color="#2b2f36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#shield)"/>
  <path d="M128 30 207 60v58c0 51-32 86-79 106-47-20-79-55-79-106V60z"
        fill="none" stroke="#6b7280" stroke-width="8" opacity=".9"/>

  <!-- Overlapping PHM monogram: the letters intentionally share space. -->
  <g fill="#e5e7eb" font-family="DejaVu Sans, Liberation Sans, sans-serif"
     font-size="76" font-weight="900" letter-spacing="-21" filter="url(#shadow)">
    <text x="61" y="154">PHM</text>
  </g>
  <path d="M74 174h108" stroke="#9ca3af" stroke-width="7" stroke-linecap="round" opacity=".95"/>
  <circle cx="188" cy="78" r="9" fill="#9ca3af"/>
</svg>
